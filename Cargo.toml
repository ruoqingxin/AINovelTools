[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/novel-application",
  "crates/novel-domain",
  "crates/novel-infrastructure",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.98"

[workspace.dependencies]
novel-application = { path = "crates/novel-application" }
novel-domain = { path = "crates/novel-domain" }
novel-infrastructure = { path = "crates/novel-infrastructure" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri = { version = "2" }
tauri-build = { version = "2" }
tauri-plugin-opener = "2"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
